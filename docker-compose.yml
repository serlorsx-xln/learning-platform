name: elearning

services:
  app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # Docker 29 / Coolify: skip attestations (export often fails mid-manifest).
      provenance: false
      sbom: false
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/platform.db
      INTERNAL_CALLBACK_URL: http://app:3000
      WORKER_ANDREWBIGGS_URL: http://worker-andrewbiggs:8001
      WORKER_EDLEARNING_URL: http://worker-edlearning:8002
      WORKER_SPEEXX_URL: http://worker-speexx:8003
    volumes:
      - platform-data:/app/data
    # Coolify/Traefik: expose only (no host bind) so it does not clash on main.
    # Local overlay still binds 0.0.0.0:3000 via docker-compose.local.yml.
    # Networking/Traefik labels: leave to Coolify (extra coolify network broke public Traefik).
    expose:
      - "3000"
    depends_on:
      worker-andrewbiggs:
        condition: service_healthy
      worker-edlearning:
        condition: service_healthy
      worker-speexx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker-andrewbiggs:
    build:
      context: ./services/worker-andrewbiggs
      provenance: false
      sbom: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-edlearning:
    build:
      context: ./services/worker-edlearning
      provenance: false
      sbom: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-speexx:
    build:
      context: ./services/worker-speexx
      provenance: false
      sbom: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  platform-data:
