name: learning

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/platform.db
      INTERNAL_CALLBACK_URL: http://web:3000
      WORKER_ANDREWBIGGS_URL: http://worker-andrewbiggs:8001
      WORKER_EDLEARNING_URL: http://worker-edlearning:8002
      WORKER_SPEEXX_URL: http://worker-speexx:8003
    volumes:
      - platform-data:/app/data
    # Coolify/Traefik: expose only (no host bind) so it does not clash on main.
    # Local overlay still binds 0.0.0.0:3000 via docker-compose.local.yml.
    expose:
      - "3000"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.learning-http.rule=Host(`learning.slynxstudio.net`)
      - traefik.http.routers.learning-http.entrypoints=http
      - traefik.http.routers.learning-https.rule=Host(`learning.slynxstudio.net`)
      - traefik.http.routers.learning-https.entrypoints=https
      - traefik.http.routers.learning-https.tls=true
      - traefik.http.routers.learning-https.tls.certresolver=letsencrypt
      - traefik.http.services.learning.loadbalancer.server.port=3000
      - traefik.http.routers.learning-http.service=learning
      - traefik.http.routers.learning-https.service=learning
    depends_on:
      worker-andrewbiggs:
        condition: service_healthy
      worker-edlearning:
        condition: service_healthy
      worker-speexx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker-andrewbiggs:
    build: ./services/worker-andrewbiggs
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-edlearning:
    build: ./services/worker-edlearning
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-speexx:
    build: ./services/worker-speexx
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  platform-data:

networks:
  coolify:
    external: true
